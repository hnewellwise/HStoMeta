name = "hstometa"
main = "worker.js"
compatibility_date = "2024-01-01"

[triggers]
crons = ["0 6 * * *"]

[[kv_namespaces]]
binding = "CAPI_LOGS"
id = "c36e5f36b64d4c98b176464ce4e0c0da"

[[d1_databases]]
binding = "DB"
database_name = "hstometa"
database_id = "a3127e13-db99-4f26-9113-ca847d60d624"

# Secrets are set via Cloudflare dashboard — never commit them here
# Workers & Pages > your worker > Settings > Variables > Add secret
#
# Required:
#   HUBSPOT_ACCESS_TOKEN
#   META_PIXEL_ID
#   META_ACCESS_TOKEN
#
# Optional (remove once live):
#   META_TEST_EVENT_CODE

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1